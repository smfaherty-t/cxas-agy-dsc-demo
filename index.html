<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dollar Shave Club | A Great Shave for a Few Bucks a Month</title>
    <meta name="description" content="Welcome to Dollar Shave Club. Everything you need to look, feel, and smell your best delivered right to your door." />

    <!-- Google CCAI / CX Agent Studio Chat Messenger SDK & Stylesheets -->
    <script defer src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js"></script>
    <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css">
    <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css">
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- CX Agent Studio Context Registration and Widget -->
    <script>
      window.addEventListener("chat-messenger-loaded", () => {
        if (window.chatSdk && window.chatSdk.registerContext && window.chatSdk.prebuilts) {
          window.chatSdk.registerContext(
            window.chatSdk.prebuilts.ces.createContext({
              deploymentName: "projects/137470913560/locations/us/apps/82a19631-fe39-40fa-a593-60778d958407/deployments/93ef4da3-d0a5-4db9-b686-cb0f5a2537fb"
            }),
          );
        }
      });
    </script>
    <!-- Update the url-allowlist attribute with a comma-separated list of origins allowed to render images -->
    <chat-messenger url-allowlist="*">
      <chat-messenger-container
        chat-title="Dollar Shave Club"
        chat-title-icon="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png"
        enable-file-upload
      >
        <chat-reset-session-button
          slot="titlebar-actions"
          title-text="Start new chat"
        ></chat-reset-session-button>
        <chat-toggle-dialog-button
          slot="titlebar-actions"
          title-text-expanded="Collapse"
          title-text-collapsed="Expand"
        ></chat-toggle-dialog-button>
        <chat-messenger-close-button
          slot="titlebar-actions"
          title-text="Close"
        ></chat-messenger-close-button>
      </chat-messenger-container>
    </chat-messenger>
  </body>
</html>
