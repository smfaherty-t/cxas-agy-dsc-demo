<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No Frills Starter Set &ndash; Dollar Shave Club</title>
    <meta name="description" content="Get started with a top-quality shave for less. The No Frills Starter Set includes a Signature 6-Blade Razor, Diamond Grip Handle, and Shave Butter." />

    <!-- Google CCAI / CX Agent Studio Chat Messenger SDK & Stylesheets -->
    <script defer src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js"></script>
    <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css">
    <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css">
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- CX Agent Studio Context Registration and Lower-Left Chat Controller -->
    <script>
      // 1. Unconditionally define the global chat API immediately
      window.openCxasChat = function(promptText) {
        const cm = document.querySelector("chat-messenger");
        const launcher = document.getElementById("cxas-bubble-launcher");
        if (cm) {
          cm.classList.remove("dsc-chat-closed");
        }
        if (launcher) {
          launcher.setAttribute("aria-expanded", "true");
        }
        if (promptText && cm) {
          window.sendCxasPrompt(promptText);
        }
      };

      window.closeCxasChat = function() {
        const cm = document.querySelector("chat-messenger");
        const launcher = document.getElementById("cxas-bubble-launcher");
        if (cm) {
          cm.classList.add("dsc-chat-closed");
        }
        if (launcher) {
          launcher.setAttribute("aria-expanded", "false");
        }
      };

      window.toggleCxasChat = function() {
        const cm = document.querySelector("chat-messenger");
        if (!cm) return;
        if (cm.classList.contains("dsc-chat-closed")) {
          window.openCxasChat();
        } else {
          window.closeCxasChat();
        }
      };

      function findInShadow(node, selector) {
        if (!node) return null;
        if (node.querySelector) {
          const direct = node.querySelector(selector);
          if (direct) return direct;
        }
        const root = node.shadowRoot || node;
        if (root && root.querySelector) {
          const directRoot = root.querySelector(selector);
          if (directRoot) return directRoot;
        }
        const children = (root && root.querySelectorAll) ? root.querySelectorAll("*") : [];
        for (const child of children) {
          if (child.shadowRoot) {
            const found = findInShadow(child.shadowRoot, selector);
            if (found) return found;
          }
        }
        return null;
      }

      window.sendCxasPrompt = function(promptText) {
        if (!promptText) return;
        const cm = document.querySelector("chat-messenger");
        const launcher = document.getElementById("cxas-bubble-launcher");
        if (cm) {
          cm.classList.remove("dsc-chat-closed");
        }
        if (launcher) {
          launcher.setAttribute("aria-expanded", "true");
        }

        const wc = document.getElementById("cxas-welcome-card");
        if (wc) wc.classList.add("cxas-welcome-minimized");

        setTimeout(() => {
          if (!cm) return;
          if (typeof cm.renderCustomText === "function") {
            try { cm.renderCustomText(promptText, false); } catch (_) {}
          }
          if (typeof cm.sendQuery === "function") {
            try { cm.sendQuery(promptText); return; } catch (_) {}
          }
          if (window.chatSdk && typeof window.chatSdk.sendMessage === "function") {
            try { window.chatSdk.sendMessage(promptText); return; } catch (_) {}
          }

          const inputEl = findInShadow(cm, "textarea, input:not([type='file']):not([type='hidden'])");
          if (inputEl) {
            inputEl.value = promptText;
            inputEl.dispatchEvent(new Event("input", { bubbles: true, composed: true }));
            inputEl.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
            inputEl.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", keyCode: 13, which: 13, bubbles: true, composed: true }));
            const form = inputEl.closest("form") || inputEl.parentElement;
            const sendBtn = form ? form.querySelector("button, [role='button']") : null;
            if (sendBtn) sendBtn.click();
          }
        }, 120);
      };

      // 2. Initialize controller exactly once
      function initCxasBubbleController() {
        const cm = document.querySelector("chat-messenger");
        const launcher = document.getElementById("cxas-bubble-launcher");
        if (!cm || !launcher) return;

        if (!window.__cxasBubbleControllerInitialized) {
          window.__cxasBubbleControllerInitialized = true;

          // Set initial closed state
          cm.classList.add("dsc-chat-closed");
          launcher.setAttribute("aria-expanded", "false");

          // Bind single click listener
          launcher.addEventListener("click", function(e) {
            e.preventDefault();
            e.stopPropagation();
            window.toggleCxasChat();
          });

          // Close on titlebar close button event
          cm.addEventListener("chat-messenger-close", function() {
            window.closeCxasChat();
          });
        }

        // Prevent duplicate right-side bubbles if internal wrapper spawns in shadowRoot
        function patchShadow() {
          if (cm.shadowRoot && !cm.shadowRoot.querySelector("#dsc-shadow-fix")) {
            const shadowStyle = document.createElement("style");
            shadowStyle.id = "dsc-shadow-fix";
            shadowStyle.textContent = `
              .chat-bubble-default-wrapper {
                display: none !important;
                visibility: hidden !important;
                pointer-events: none !important;
              }
            `;
            cm.shadowRoot.appendChild(shadowStyle);
          }
        }

        patchShadow();
        initWelcomeButtons();
        if (window.customElements && window.customElements.whenDefined) {
          window.customElements.whenDefined("chat-messenger").then(() => {
            patchShadow();
            initWelcomeButtons();
          });
        }
      }

      function initWelcomeButtons() {
        const card = document.getElementById("cxas-welcome-card");
        if (!card) return;
        const buttons = card.querySelectorAll(".cxas-quick-btn");
        buttons.forEach((btn) => {
          if (btn.dataset.initialized) return;
          btn.dataset.initialized = "true";
          btn.addEventListener("click", function(e) {
            e.preventDefault();
            e.stopPropagation();
            const prompt = btn.getAttribute("data-cxas-prompt");
            if (prompt) {
              window.sendCxasPrompt(prompt);
            }
          });
        });

        const resetBtn = document.querySelector("chat-reset-session-button");
        if (resetBtn && !resetBtn.dataset.resetBound) {
          resetBtn.dataset.resetBound = "true";
          resetBtn.addEventListener("click", function() {
            card.classList.remove("cxas-welcome-minimized");
          });
        }
      }

      // Safely run lifecycle initialization
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initCxasBubbleController);
      } else {
        initCxasBubbleController();
      }
      window.addEventListener("chat-messenger-loaded", initCxasBubbleController);
      window.addEventListener("chat-messenger-message-list-loaded", initWelcomeButtons);

      // Register CES context and acquire public chat session token upon chat-messenger SDK load
      async function initializeCxasChatContext() {
        if (!window.chatSdk || !window.chatSdk.registerContext || !window.chatSdk.prebuilts) return;

        const deploymentName = "projects/137470913560/locations/us/apps/82a19631-fe39-40fa-a593-60778d958407/deployments/93ef4da3-d0a5-4db9-b686-cb0f5a2537fb";

        // Create context with tokenBroker enabled for CES
        const ctx = window.chatSdk.prebuilts.ces.createContext({
          deploymentName: deploymentName,
          tokenBroker: {
            enableTokenBroker: true
          }
        });
        window.chatSdk.registerContext(ctx);

        // Pre-fetch and assign token directly into context state and chat-messenger element
        try {
          const sessionId = ctx?.state?.sessionId || ("dfMessenger-" + Math.random().toString(36).substring(2));
          if (ctx?.state && !ctx.state.sessionId) {
            ctx.state.sessionId = sessionId;
          }
          const tokenRes = await fetch(`https://ces.googleapis.com/v1beta/projects/137470913560/locations/us/apps/82a19631-fe39-40fa-a593-60778d958407/sessions/${sessionId}:generateChatToken`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ deployment: deploymentName })
          });
          if (tokenRes.ok) {
            const data = await tokenRes.json();
            if (data.chatToken) {
              if (ctx && ctx.state) {
                ctx.state.accessToken = data.chatToken;
                ctx.state.accessTokenExpiresAt = data.expireTime;
              }
              const cm = document.querySelector("chat-messenger");
              if (cm) {
                cm.accessToken = data.chatToken;
              }
              try {
                sessionStorage.setItem("chat-messenger-access-token", data.chatToken);
                if (data.expireTime) {
                  sessionStorage.setItem("chat-messenger-access-token-expires-at", data.expireTime);
                }
              } catch (_) {}
            }
          }
        } catch (e) {
          console.warn("[CXAS] Pre-fetch token error:", e);
        }
      }

      window.addEventListener("chat-messenger-loaded", initializeCxasChatContext);
      window.addEventListener("chat-messenger-access-token-resolved", () => {
        const cm = document.querySelector("chat-messenger");
        const ctx = window.chatSdk?.getContext();
        if (cm && ctx?.state?.accessToken) {
          cm.accessToken = ctx.state.accessToken;
        }
      });

      // ======================================================================
      // Multimodal Damage Photo Upload & Gemini AI Vision Analysis Pipeline
      // ======================================================================
      let isUploadingPhoto = false;

      window.triggerDamagePhotoUpload = function() {
        const input = document.getElementById("cxas-photo-input");
        if (input) {
          input.value = "";
          input.click();
        }
      };

      function displayDamageCardInChat(data, previewUrl) {
        const cm = document.querySelector("chat-messenger");
        if (!cm) return;

        const card = document.createElement("div");
        card.className = "cxas-ai-damage-result-card";
        const imgUrl = data.imageUrl || previewUrl;
        const rep = data.replacement || {};
        const analysis = data.damageAnalysis || {};
        const severity = analysis.severity || "High";
        const summary = analysis.summary || "Visual damage confirmed: packaging rupture and product discharge.";
        const repId = rep.replacementId || "DSC-7721-R1";
        const address = rep.shippingAddress || "789 Pine Road, Boulder CO 80302";

        card.innerHTML = `
          <div class="cxas-ai-damage-img-wrap">
            <img src="${imgUrl}" alt="Damaged Product Photo" class="cxas-ai-damage-img" />
            <span class="cxas-ai-badge">GEMINI AI VISION VERIFIED</span>
          </div>
          <div class="cxas-ai-damage-body">
            <div class="cxas-ai-damage-title">
              <span>✅</span>
              <span>Damage Confirmed (${severity} Severity)</span>
            </div>
            <div class="cxas-ai-damage-summary">${summary}</div>
            <div class="cxas-ai-damage-order">
              <span style="font-size: 16px;">📦</span>
              <div>
                <strong style="color: #34d399;">Free Replacement Authorized: #${repId}</strong>
                <div style="color: #a8a29e; margin-top: 2px;">Rush 24-Hr Delivery to ${address}</div>
              </div>
            </div>
          </div>
        `;

        const target = findInShadow(cm, "chat-messenger-message-list, .message-list") || cm;
        if (target) {
          target.appendChild(card);
          try { card.scrollIntoView({ behavior: "smooth", block: "end" }); } catch (_) {}
        }
      }

      async function handlePhotoUpload(file) {
        if (!file || isUploadingPhoto) return;
        if (!file.type.startsWith("image/")) {
          alert("Please select an image file (JPG, PNG, WebP).");
          return;
        }

        isUploadingPhoto = true;
        window.openCxasChat();

        const previewUrl = URL.createObjectURL(file);
        const cm = document.querySelector("chat-messenger");

        if (cm && typeof cm.renderCustomText === "function") {
          try {
            cm.renderCustomText("📸 Uploaded damage photo: " + file.name + " (" + Math.round(file.size / 1024) + " KB)", false);
            cm.renderCustomText("🔍 Inspecting damage with Gemini AI Multimodal Vision...", true);
          } catch (_) {}
        }

        const reader = new FileReader();
        reader.onload = async (e) => {
          const base64Data = e.target.result;
          try {
            const res = await fetch("/api/damage/validate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: "chris@example.com",
                originalOrderNumber: "DSC-7721",
                imageBase64: base64Data,
                imageName: file.name,
                item: "Dr. Carver's Easy Shave Butter (6 oz)",
                description: "Customer uploaded photo of damaged package in transit."
              })
            });

            if (res.ok) {
              const data = await res.json();
              displayDamageCardInChat(data, previewUrl);

              const summary = data.damageAnalysis?.summary || "Shave Butter container rupture with product discharge";
              const repId = data.replacement?.replacementId || "DSC-7721-R1";

              setTimeout(() => {
                window.sendCxasPrompt(
                  "I uploaded the damaged product photo. AI vision verified: " + summary + ". Free replacement order #" + repId + " is authorized. Please confirm."
                );
              }, 400);
            } else {
              console.error("[CXAS] Damage validation response error:", await res.text());
            }
          } catch (err) {
            console.error("[CXAS] Damage upload network error:", err);
          } finally {
            isUploadingPhoto = false;
          }
        };
        reader.readAsDataURL(file);
      }

      // Bind upload triggers once DOM and custom elements load
      function initUploadTriggers() {
        const uploadBtn = document.getElementById("cxas-titlebar-upload-btn");
        if (uploadBtn && !uploadBtn.dataset.bound) {
          uploadBtn.dataset.bound = "true";
          uploadBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            window.triggerDamagePhotoUpload();
          });
        }

        const photoInput = document.getElementById("cxas-photo-input");
        if (photoInput && !photoInput.dataset.bound) {
          photoInput.dataset.bound = "true";
          photoInput.addEventListener("change", (e) => {
            if (e.target.files && e.target.files[0]) {
              handlePhotoUpload(e.target.files[0]);
            }
          });
        }

        const cm = document.querySelector("chat-messenger");
        if (cm && !cm.dataset.uploadBound) {
          cm.dataset.uploadBound = "true";

          cm.addEventListener("chat-messenger-button-clicked", (e) => {
            const evtName = e.detail?.event || "";
            const txt = (e.detail?.text || "").toLowerCase();
            if (evtName === "trigger-photo-upload" || txt.includes("upload") || txt.includes("photo")) {
              window.triggerDamagePhotoUpload();
            }
          });

          window.addEventListener("trigger-photo-upload", () => {
            window.triggerDamagePhotoUpload();
          });

          cm.addEventListener("dragover", (e) => { e.preventDefault(); });
          cm.addEventListener("drop", (e) => {
            e.preventDefault();
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
              handlePhotoUpload(e.dataTransfer.files[0]);
            }
          });
        }
      }

      window.addEventListener("DOMContentLoaded", initUploadTriggers);
      window.addEventListener("chat-messenger-loaded", initUploadTriggers);
    </script>

    <!-- Lower-Left Floating Chat Bubble Launcher -->
    <div id="cxas-bubble-container">
      <button
        id="cxas-bubble-launcher"
        type="button"
        aria-label="Open AI Grooming Advisor chat"
        aria-expanded="false"
        class="cxas-bubble-btn"
      >
        <div class="cxas-bubble-icon-wrap">
          <img
            src="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png"
            alt="AI Grooming Advisor"
            class="cxas-bubble-icon"
          />
          <span class="cxas-live-indicator"></span>
        </div>
        <div class="cxas-bubble-label">
          <span class="cxas-bubble-badge">AI ADVISOR</span>
          <span class="cxas-bubble-text">Chat with us</span>
        </div>
      </button>
    </div>

    <!-- Hidden Native File Input for Photo Uploads -->
    <input
      type="file"
      id="cxas-photo-input"
      accept="image/jpeg,image/png,image/webp"
      style="position: fixed; top: -9999px; left: -9999px; opacity: 0; pointer-events: none;"
    />

    <!-- Update the url-allowlist attribute with a comma-separated list of origins allowed to render images -->
    <chat-messenger
      service='{"name":"ces","deployment-id":"projects/137470913560/locations/us/apps/82a19631-fe39-40fa-a593-60778d958407/deployments/93ef4da3-d0a5-4db9-b686-cb0f5a2537fb"}'
      enable-file-upload="true"
      url-allowlist="*"
      class="dsc-chat-closed"
      welcome-screen="true"
      suggested-actions='["Check order status", "I need to change my shipping address", "My order arrived at the wrong address"]'
    >
      <!-- Welcome Greeting & Common Inquiries Quick Actions Card -->
      <div id="cxas-welcome-card" slot="messages-header" class="cxas-welcome-card" role="region" aria-label="Welcome and quick options">
        <div class="cxas-welcome-header">
          <div class="cxas-welcome-badge">DOLLAR SHAVE CLUB ASSISTANT</div>
          <div class="cxas-welcome-title">👋 Hey there! Welcome to Dollar Shave Club</div>
          <div class="cxas-welcome-subtitle">How can we help you look, feel, and smell your best today? Choose an inquiry below or type your message:</div>
        </div>
        <div class="cxas-quick-buttons">
          <button type="button" class="cxas-quick-btn" data-cxas-prompt="Check order status">
            <span class="cxas-quick-icon">📦</span>
            <span>Order status</span>
          </button>
          <button type="button" class="cxas-quick-btn" data-cxas-prompt="I need to change my shipping address">
            <span class="cxas-quick-icon">📍</span>
            <span>Change address</span>
          </button>
          <button type="button" class="cxas-quick-btn" data-cxas-prompt="My order arrived at the wrong address">
            <span class="cxas-quick-icon">⚠️</span>
            <span>Order arrived at wrong address</span>
          </button>
        </div>
      </div>

      <chat-messenger-container
        chat-title="Dollar Shave Club"
        chat-title-icon="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png"
        enable-file-upload="true"
      >
        <button
          type="button"
          id="cxas-titlebar-upload-btn"
          slot="titlebar-actions"
          class="cxas-titlebar-upload-btn"
          title="Upload photo of damaged product"
          aria-label="Upload photo of damaged product"
        >
          📷 Upload Photo
        </button>
        <chat-reset-session-button
          slot="titlebar-actions"
          title-text="Start new chat"
        ></chat-reset-session-button>
        <chat-toggle-dialog-button
          slot="titlebar-actions"
          title-text-expanded="Collapse"
          title-text-collapsed="Expand"
        ></chat-toggle-dialog-button>
        <chat-messenger-close-button
          slot="titlebar-actions"
          title-text="Close"
        ></chat-messenger-close-button>
      </chat-messenger-container>
    </chat-messenger>
  </body>
</html>
